<div class="fab-wrapper">
    <label class="fab" onclick="toggleChat();">
        <img src="https://cdn-icons-png.flaticon.com/128/8943/8943377.png"
             alt="Chat Icon"
             class="fab-icon" />
        <span class="fab-title">Chat ngay</span>
    </label>
</div>

<!-- Biểu tượng chat và cửa sổ chat -->
<div id="chatbox">
    <div>
        <strong>Chatbot</strong>
        <span id="close-chat">&times;</span>
    </div>
    <div id="chat-content"></div>
    <div style="position: relative">
        <textarea id="user-input" placeholder="Nhập tin nhắn."></textarea>
        <span id="resize-icon" title="Phóng to/thu nhỏ"></span>
        <button id="send-button">GỬI</button>
        <button id="clear-chat">Xóa</button>
    </div>
</div>

<style>
    /* Cửa sổ chat */
    #chatbox {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 400px;
        height: 500px;
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        z-index: 100000;
        border-radius: 10px;
        flex-direction: column;
    }

        #chatbox > div {
            box-sizing: border-box;
        }

            #chatbox > div:first-child {
                background-color: #003366;
                color: #fff;
                padding: 10px;
                text-align: center;
                border-radius: 10px 10px 0 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

        #chatbox #close-chat {
            cursor: pointer;
            font-weight: bold;
        }

    #close-chat {
        font-size: 26px;
    }

    #chat-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        background: #f9f9f9;
    }

    #chatbox > div:last-child {
        padding: 10px;
        border-top: 1px solid #ddd;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
    }

    textarea {
        min-height: 40px;
    }

    #resize-icon {
        position: absolute;
        right: 143px;
        bottom: 33px;
        width: 15px;
        height: 20px;
        background: url("https://cdn-icons-png.flaticon.com/128/318/318140.png") no-repeat center center; /* Biểu tượng phóng to */
        background-size: contain;
        cursor: pointer;
        z-index: 10;
    }

        #resize-icon.expanded {
            right: 15px;
            top: 10px;
            background: url("https://cdn-icons-png.flaticon.com/128/8591/8591668.png") no-repeat center center; /* Biểu tượng sau khi phóng to */
            background-size: contain;
        }

    #user-input {
        flex: 4;
        padding: 8px; /* Dịch khoảng trống để chừa chỗ cho biểu tượng */
        height: 40px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-right: 2px;
        overflow-y: hidden;
        font-size: 14px;
        margin-bottom: 0px;
        box-sizing: border-box;
        width: auto; /* Thiết lập chiều rộng mặc định */
    }

    textarea {
        transition: all 0.3s ease; /* Tạo hiệu ứng mượt khi phóng to và thu nhỏ */
    }

    #user-input.expanded {
        width: 100%;
        height: 150px;
    }

    #chatbox > div:last-child {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        align-items: center;
    }

    #send-button,
    #clear-chat {
        padding: 0 0px; /* Giảm padding để nút nhỏ hơn */
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: #fff;
        flex: 1; /* Đảm bảo các nút có cùng độ rộng */
        height: 40px; /* Chiều cao đồng bộ với ô nhập liệu */
        margin: 3px;
        text-align: center;
    }

    #send-button {
        background-color: #003366;
    }

    #clear-chat {
        width: 10px;
        background-color: #f44336;
    }

    /* Tin nhắn */
    .chat-message {
        margin: 10px 0;
    }

        .chat-message.user {
            text-align: right;
        }

        .chat-message.bot {
            text-align: left;
        }

        .chat-message div {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 70%;
        }

        .chat-message.user div {
            background: #dcf8c6;
            color: #000;
        }

        .chat-message.bot div {
            background: #ffffff;
            color: #000;
            border: 1px solid #ddd;
        }

        .chat-message strong {
            display: block;
            margin-bottom: 5px;
        }

        .chat-message.user strong {
            color: #4caf50;
        }

        .chat-message.bot strong {
            color: #d9001b;
        }

    /* Nút chat ngay */
    .fab-wrapper {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
    }

    .fab {
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        border-radius: 50%;
        background: #d70018;
        box-shadow: 0 3px 6px rgb(0 0 0 / 16%), 0 3px 6px rgb(0 0 0 / 23%);
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 10000;
        overflow: hidden;
        cursor: pointer;
    }

    .fab-icon {
        width: 30px;
        height: 30px;
        display: block;
    }

    .fab-title {
        display: none;
        position: absolute;
        right: 70px;
        background: #d70018;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
    }

    .fab:hover .fab-title {
        display: block;
    }

    @keyframes zoom {
        0% {
            transform: scale(0.9);
        }

        70% {
            transform: scale(1);
            box-shadow: 0 0 0 15px transparent;
        }

        100% {
            transform: scale(0.9);
            box-shadow: 0 0 0 0 transparent;
        }
    }

    .fab {
        animation-name: zoom;
        animation-delay: 0s;
        animation-duration: 1.5s;
        animation-iteration-count: infinite;
        cursor: pointer;
        box-shadow: 0 0 0 0 #c31d1d;
    }
</style>

<script>
    // JavaScript cho chatbox
    const chatbox = document.getElementById("chatbox");
    const closeChat = document.getElementById("close-chat");
    const inputField = document.getElementById("user-input");
    const chatContent = document.getElementById("chat-content");
    const sendButton = document.getElementById("send-button");
    const clearChat = document.getElementById("clear-chat");

    function toggleChat() {
        if (chatbox.style.display === "flex") {
            chatbox.style.display = "none";
        } else {
            chatbox.style.display = "flex";
        }
    }

    closeChat.addEventListener("click", toggleChat);

    async function sendMessage() {
        const userInput = inputField.value.trim();
        if (userInput === "") return;

        chatContent.innerHTML += `
      <div class="chat-message user">
        <div>
          <strong>Bạn</strong>
          ${userInput}
        </div>
      </div>`;
        inputField.value = "";
        chatContent.scrollTop = chatContent.scrollHeight;

        try {
            const response = await fetch(
                "http://localhost:1234/v1/chat/completions",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "vistral-7b-chat",
                        messages: [{ role: "user", content: userInput }],
                    }),
                }
            );

            const result = await response.json();
            const botResponse =
                result?.choices?.[0]?.message?.content || "Chatbot không phản hồi.";

            chatContent.innerHTML += `
        <div class="chat-message bot">
          <div>
            <strong>Vistral</strong>
            ${botResponse}
          </div>
        </div>`;
            chatContent.scrollTop = chatContent.scrollHeight;
        } catch (error) {
            chatContent.innerHTML += `
        <div class="chat-message bot">
          <div style="color: red;">
            <strong>Vistral</strong>: Lỗi kết nối đến server.
          </div>
        </div>`;
        }
    }

    inputField.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        } else if (e.key === "Enter" && e.shiftKey) {
            const cursorPos = inputField.selectionStart;
            const text = inputField.value;
            inputField.value = `${text.slice(0, cursorPos)}\n${text.slice(cursorPos)}`;
            inputField.selectionStart = inputField.selectionEnd = cursorPos + 1;
            e.preventDefault();
        }
    });

    sendButton.addEventListener("click", sendMessage);

    clearChat.addEventListener("click", () => {
        chatContent.innerHTML = "";
    });

    const resizeIcon = document.getElementById("resize-icon");
    const userInput = document.getElementById("user-input");

    let isExpanded = false;

    resizeIcon.addEventListener("click", () => {
        if (isExpanded) {
            userInput.classList.remove("expanded");
            resizeIcon.classList.remove("expanded");
            userInput.style.width = "auto";
            userInput.style.height = "40px";
            sendButton.style.display = "inline-block";
            clearChat.style.display = "inline-block";
        } else {
            userInput.classList.add("expanded");
            resizeIcon.classList.add("expanded");
            userInput.style.width = "100%";
            userInput.style.height = "150px";
            sendButton.style.display = "none";
            clearChat.style.display = "none";
        }
        isExpanded = !isExpanded;
    });
</script>
